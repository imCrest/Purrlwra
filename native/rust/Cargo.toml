[package]
name = "purrfectsnap"
version = "0.1.0"
authors = ["crest"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
android_logger = "0.14.1"
dobby-rs = "0.1.0"
jni = "0.21.1"
log = "0.4.25"
nix = { version = "0.29.0", features = ["fs"] }
once_cell = "1.20.2"
paste = "1.0.15"
procfs = "0.17.0"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13.2"
goldberg = "0.1.0"
crc32fast = "1.4.0"
libc = "0.2"
sha2 = "0.10"
zip = "0.6.6"
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", default-features = true, features = ["std"] }

[build-dependencies]
cc = "1.0"

